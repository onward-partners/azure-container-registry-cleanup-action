name: '@onward-partners/azure-container-registry-cleanup-action'
description: 'This action cleans up old image tags in an Azure Container Registry'
author: 'scomans'
inputs:
  keep:
    required: false
    description: 'Amount of images to keep'
    default: '3'
  dontCountUntaggedImages:
    required: false
    description: 'If set to true all untagged images will not add to the amount of kept images'
    default: 'true'
  deleteOrphanedSignatures:
    required: false
    description: 'Cosign signatures/attestations (sha256-<digest>.sig/.att/.sbom) are kept or deleted together with the image they belong to. If set to true, signatures whose image no longer exists are deleted as well. Set to false to keep them'
    default: 'true'
  tenantId:
    required: true
    description: 'Azure Tenant ID'
  secret:
    required: false
    description: 'Azure client secret. If omitted, the action authenticates via GitHub OIDC (federated credentials). This requires "permissions: id-token: write" in the workflow'
  clientId:
    required: true
    description: 'Azure Client ID'
  repos:
    required: true
    description: 'Repos that will be cleaned. Can be seperated by spaces, comma, semicolon or new line'
  endpoint:
    required: true
    description: 'Azure Container Registry endpoint'
  oidcAudience:
    required: false
    default: 'api://AzureADTokenExchange'
    description: 'Audience of the GitHub OIDC token used when no secret is provided'
  audience:
    required: false
    default: PublicCloud
    description: 'Cloud audience for Azure Container Registry. Possible values: PublicCloud, China, Germany, Government'

runs:
  using: 'node24'
  main: 'dist/index.js'
